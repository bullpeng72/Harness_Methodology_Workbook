[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-triage"
version = "0.4.0"
description = "《하니스 메서드 실습서》 러닝 예제 — 지원 티켓 트리아지 에이전트"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "agent-evaluator[sdk]>=1.0.0",
    "anthropic>=0.40",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
