[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-triage"
version = "0.4.0"
description = "《하니스 메서드 실습서》 러닝 예제 — 지원 티켓 트리아지 에이전트"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "agent-evaluator[sdk]>=1.0.0",
    "anthropic>=0.40",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# 부트스트랩 스크립트: 동봉 저장소를 클론만 하고 `pip install -e` 없이 돌릴 수 있게
# 로컬 패키지(src/, baseline/)를 sys.path 로 먼저 잡은 뒤 import 한다 (의도된 순서).
"eval/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
