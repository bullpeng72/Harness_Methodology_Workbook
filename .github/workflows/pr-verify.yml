name: pr-verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      # Ollama가 없는 CI에서는 tier2_fallback(Claude)로 — ANTHROPIC_API_KEY 시크릿 필요.
      # 절대 점수가 로컬과 다를 수 있으므로 회귀 게이트 위주로 판정 (ADR-003).
      - name: run batch eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPPORT_TRIAGE_OFFLINE: ${{ secrets.ANTHROPIC_API_KEY == '' && '1' || '' }}
        run: python eval/run_batch.py --note "ci" --out ci_run
      - name: absolute gate (느슨 — CI 폴백 감안)
        run: agent-eval gate results/ci_run.json --tcr 70 --accuracy 55
      # 회귀 게이트 — results/baselines/current.json 이 저장소에 커밋돼 있어야 한다 (본편 §20.4.3).
      # 없으면 "No baseline file found — skipping" 후 통과하므로, baseline 미커밋은 CI가 무력화된다.
      - name: regression gate (exit 2 on regression)
        run: agent-eval gate results/ci_run.json --baseline-version current --fail-on-regression 12
      - name: golden regression gate (exit 3)
        run: agent-eval gate results/ci_run.json --golden-set data/golden/golden_core.json --fail-on-golden-regression

  claims-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      # agent-eval claims audit CLI 는 위반 시 exit 1 (본편 §11). 별도 파싱 불필요.
      - run: agent-eval claims audit --ttl-hours 8

  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - name: adversarial eval (injection + pii 포함)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPPORT_TRIAGE_OFFLINE: ${{ secrets.ANTHROPIC_API_KEY == '' && '1' || '' }}
        run: python eval/run_adversarial.py --out sec_run
      - name: Gate E 임계값 (0.95)
        run: agent-eval gate results/sec_run.json --gate-thresholds E=0.95
